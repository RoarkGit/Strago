name: Update Blue-Mage-Data submodule

on:
  repository_dispatch:
    types: [blue-mage-data-updated]

concurrency:
  group: update-submodule
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT }}

      - name: Update submodule
        run: git submodule update --remote data/blue-mage-data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blue-mage-data
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update Blue-Mage-Data submodule"
          git push
